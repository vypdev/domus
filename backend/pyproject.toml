[project]
name = "domus-server"
version = "0.0.0"
description = "Local household application backend for Domus"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.scripts]
domus-server = "domus.composition.server:main"
domus-ingress = "domus.composition.ingress:main"
domus-admin = "domus.composition.admin:main"
domus-ha-app = "domus.composition.ha_app:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domus"]

[tool.hatch.build]
artifacts = ["src/domus/ui/**"]
