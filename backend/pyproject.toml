[project]
name = "domus-server"
version = "0.0.0"
description = "Local household application backend for Domus"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx==0.28.1",
    "websockets==17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domus"]
