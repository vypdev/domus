name: CI Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [develop, master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  python:
    name: Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tooling
      - name: Test all Python tooling with coverage
        run: uv run pytest tests/python --cov=domus_tooling --cov-branch --cov-report=term-missing --cov-report=json:coverage-python.json --cov-report=xml:coverage-python.xml
      - name: Retain tooling coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tooling-coverage-${{ github.sha }}
          path: |
            coverage-python.json
            coverage-python.xml
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run mypy backend/src
      - name: Test every authored backend module with separate coverage
        run: uv run pytest tests/backend --cov=domus --cov-branch --cov-report=term-missing --cov-report=json:coverage-backend.json --cov-report=xml:coverage-backend.xml
      - name: Audit every backend file against independent source analysis
        run: uv run domus-check backend-coverage --report coverage-backend.json
      - name: Retain backend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            coverage-backend.json
            coverage-backend.xml
          if-no-files-found: error
          retention-days: 7

  node:
    name: Node architecture policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Retain policy coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-policy-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  frontend_toolchain:
    name: Frontend toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domus/frontend-toolchain exec playwright install --with-deps chromium
      - run: pnpm check:frontend-toolchain
      - run: pnpm test:frontend-toolchain
      - run: pnpm build:frontend-toolchain
      - run: pnpm test:frontend-browser
      - run: pnpm test:frontend-guards
      - name: Retain distinct framework fixture outputs and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-toolchain-${{ github.sha }}
          path: |
            tests/fixtures/frontend-toolchain/coverage/
            tests/fixtures/frontend-toolchain/coverage-negative/
            tests/fixtures/frontend-toolchain/dist/
            tests/fixtures/frontend-toolchain/storybook-static/
            tests/fixtures/frontend-toolchain/test-results/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domus/frontend exec playwright install --with-deps chromium
      - run: pnpm check:frontend
      - run: pnpm test:frontend
      - run: pnpm build:frontend
      - run: uv build --package domus-server --wheel
      - run: uv run pytest tests/packaging --no-cov
      - run: pnpm test:frontend-entry
      - run: pnpm build:frontend-catalog
      - run: pnpm test:frontend-catalog
      - name: Retain distinct application coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-application-${{ github.sha }}
          include-hidden-files: true
          path: |
            frontend/coverage/
            frontend/storybook-static/
            frontend/test-results/
            backend/src/domus/ui/
            dist/*.whl
          if-no-files-found: error
          retention-days: 7

  architecture:
    name: Python architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run lint-imports --config architecture/python-tooling.ini --no-cache
      - run: uv run lint-imports --config architecture/python-application.ini --no-cache
      - run: uv run pytest tests/architecture

  documentation:
    name: Local documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen --no-dev
      - run: uv run --no-dev domus-check docs

  containers:
    name: App container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen
      - name: Build the exact Supervisor app folder
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t domus-app-ci addon-edge
      - name: Build the immutable previous image for upgrade and downgrade checks
        run: >-
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }}
          --build-arg BUILD_VERSION=0.0.0-edge.2
          --build-arg DOMUS_SOURCE_COMMIT=d013cf2c8b932d0e00f5858053cbc0e663d5eee1
          --build-arg DOMUS_SOURCE_SHA256=fa58d457bef8a863a1943b4e6ba5c9513da8d3baa8b0a033bdcbe7bf11b09c6c
          -t domus-app-previous tests/fixtures/edge3-app
      - name: Build the installed immutable Edge.3 image for actual upgrade acceptance
        run: >-
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }}
          -t domus-app-installed tests/fixtures/edge3-app
      - name: Verify the real image, listener and cleanup
        env:
          DOMUS_TEST_IMAGE: domus-app-ci
          DOMUS_PREVIOUS_IMAGE: domus-app-previous
          DOMUS_UPGRADE_IMAGE: domus-app-installed
        run: uv run pytest tests/containers --no-cov

  aggregate:
    name: CI Check
    if: ${{ always() }}
    needs: [python, backend, node, frontend_toolchain, frontend, architecture, documentation, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMUS_CI_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --frozen --no-dev
      - name: Require every applicable suite to succeed
        run: uv run --no-dev domus-check aggregate
