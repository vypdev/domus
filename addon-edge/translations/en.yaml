configuration:
  public_origins:
    name: Home Assistant browser origins
    description: >-
      The URLs used to open Home Assistant, including scheme and port when present,
      for example http://homeassistant.local:8123. Enter one to four distinct origins
      without paths. Restart Domus after changing them. Your existing HA sign-in is used.
  ha_calendar_digest:
    name: Calendar grant digest
    description: >-
      Optional SHA-256 digest for the native read-only calendar. Remove this
      value to disable calendar access. Restart Domus after changing it.
  ha_deadline_digest:
    name: Task deadline grant digest
    description: >-
      Optional SHA-256 digest for the read-only task deadline counts. Remove
      this value to disable sensor access. Restart Domus after changing it.
  ha_stock_digest:
    name: Low-stock product count grant digest
    description: >-
      Optional SHA-256 digest for the read-only low-stock product count. Remove the
      digest and restart Domus to revoke access. Restart after changing the digest.
  ha_shopping_digest:
    name: Shared shopping list grant digest
    description: >-
      Optional SHA-256 digest for the read-only shared shopping list. Home Assistant
      can read item names and quantities. Restart Domus after changing or removing this digest.
  ha_tasks_digest:
    name: Open-task list grant digest
    description: >-
      Optional SHA-256 digest for the read-only open-task list. Home Assistant viewers
      can read titles and states of every open household task. Restart Domus after
      changing or removing this digest.
