configuration:
  public_origins:
    name: Orígenes de Home Assistant en el navegador
    description: >-
      Introduce entre uno y cuatro orígenes distintos con protocolo y puerto
      cuando corresponda, sin rutas. Reinicia Domus después de cambiarlos.
      Domus utiliza tu sesión actual de Home Assistant.
  ha_calendar_digest:
    name: Resumen del token del calendario
    description: >-
      Resumen SHA-256 opcional para el calendario nativo de solo lectura.
      Elimina el valor para desactivar el acceso y reinicia Domus tras cambiarlo.
  ha_deadline_digest:
    name: Resumen del token de vencimientos
    description: >-
      Resumen SHA-256 opcional para los recuentos de vencimientos de solo lectura.
      Elimina el valor para desactivar el acceso y reinicia Domus tras cambiarlo.
  ha_stock_digest:
    name: Resumen del token de existencias bajas
    description: >-
      Resumen SHA-256 opcional para el recuento de productos con existencias bajas.
      Reinicia Domus tras cambiarlo. Elimina el resumen y reinicia para revocar el acceso.
  ha_shopping_digest:
    name: Resumen del token de la lista de la compra
    description: >-
      Resumen SHA-256 opcional para la lista de la compra compartida. Home Assistant
      puede leer nombres y cantidades. Reinicia Domus si cambias o eliminas el resumen.
