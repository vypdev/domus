[importlinter]
root_package = domus_tooling
include_external_packages = True

[importlinter:contract:pure-policy]
name = CI policy cannot depend on command or filesystem adapters
type = forbidden
source_modules = domus_tooling.ci_policy
forbidden_modules =
    domus_tooling.cli
    domus_tooling.docs
    os
    pathlib
    subprocess
    json
    sqlite3
    fastapi
    httpx

[importlinter:contract:no-cycles]
name = Tooling modules remain acyclic
type = acyclic_siblings
ancestors = domus_tooling
depth = 100
