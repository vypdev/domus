[importlinter]
root_package = domus
include_external_packages = True

[importlinter:contract:layers]
name = Application dependencies point inward
type = layers
layers =
    domus.composition
    domus.entrypoints | domus.infrastructure
    domus.application
    domus.domain

[importlinter:contract:pure-inner-layers]
name = Domain and application exclude concrete frameworks and I/O
type = forbidden
source_modules =
    domus.domain
    domus.application
forbidden_modules =
    fastapi
    homeassistant
    httpx
    httpx2
    websockets
    uvicorn
    starlette
    pydantic
    requests
    sqlite3
    sqlalchemy
    subprocess
    asyncio
    time
    secrets
    pathlib
    os

[importlinter:contract:no-cycles]
name = Application modules remain acyclic
type = acyclic_siblings
ancestors = domus
depth = 100
